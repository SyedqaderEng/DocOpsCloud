<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - DocOpsCloud</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="logo">DocOpsCloud</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="tools.html">Tools</a></li>
        <li><a href="pricing.html">Pricing</a></li>
        <li><a href="signup.html" class="btn btn-primary">Get Started</a></li>
      </ul>
    </div>
  </nav>

  <!-- Login Form -->
  <div class="form-container">
    <div class="form-card">
      <div class="form-header">
        <h1>Welcome Back</h1>
        <p>Sign in to your DocOpsCloud account</p>
      </div>

      <form>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-input" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" placeholder="Enter your password" required>
        </div>

        <div class="form-group">
          <div class="form-checkbox">
            <input type="checkbox" id="remember">
            <label for="remember">Remember me for 30 days</label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full" onclick="window.location.href='dashboard.html'; return false;">
          Sign In
        </button>
      </form>

      <div class="divider">or continue with</div>

      <div class="social-btns">
        <button class="btn btn-social">
          <span>🔍</span> Google
        </button>
        <button class="btn btn-social">
          <span>⚫</span> GitHub
        </button>
      </div>

      <div class="form-footer">
        <p>Don't have an account? <a href="signup.html">Sign up</a></p>
        <p class="mt-2"><a href="#">Forgot your password?</a></p>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2025 DocOpsCloud. All rights reserved.</p>
  </footer>
</body>
</html>
